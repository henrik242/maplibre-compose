name: Publish where fork

# Publishes the forked build (0.19.0 + connectivity override #1735) to this fork's GitHub Packages
# as 0.19.0-where1, for the henrik242/where app. Not an upstream flow. Android + metadata build on
# ubuntu; the iOS klibs need macOS. The two jobs run in parallel and publish to the same repo.

on:
  workflow_dispatch:
  push:
    branches: [where-interim]

permissions:
  contents: read
  packages: write

concurrency:
  group: where-fork-publish
  cancel-in-progress: true

env:
  VERSION_ARGS: >-
    -PmaplibreVersion=0.19.0-where1
    -PmaplibreReleaseVersion=0.19.0-where1
    -PmaplibreSnapshotVersion=0.19.1-SNAPSHOT
    -PsignAllPublications=false

jobs:
  android:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
      - name: Publish Android + metadata
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew --no-daemon --init-script .github/where-fork-publish.init.gradle.kts
          $VERSION_ARGS -PmaplibreSourceRef=${{ github.sha }}
          :lib:location:publishKotlinMultiplatformPublicationToGitHubPackagesRepository
          :lib:location:publishAndroidPublicationToGitHubPackagesRepository
          :lib:maplibre-compose:publishKotlinMultiplatformPublicationToGitHubPackagesRepository
          :lib:maplibre-compose:publishAndroidPublicationToGitHubPackagesRepository

  ios:
    timeout-minutes: 60
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
      - name: Publish iOS (arm64 + simulator arm64)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew --no-daemon --init-script .github/where-fork-publish.init.gradle.kts
          $VERSION_ARGS -PmaplibreSourceRef=${{ github.sha }}
          :lib:location:publishIosArm64PublicationToGitHubPackagesRepository
          :lib:location:publishIosSimulatorArm64PublicationToGitHubPackagesRepository
          :lib:maplibre-compose:publishIosArm64PublicationToGitHubPackagesRepository
          :lib:maplibre-compose:publishIosSimulatorArm64PublicationToGitHubPackagesRepository
